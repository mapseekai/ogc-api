name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.25.x", "1.27.x"]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: "**/go.sum"
      - name: Install development tools
        run: |
          python3 -m venv .artifacts/tools-venv
          .artifacts/tools-venv/bin/pip install ruff==0.9.10
          echo "$PWD/.artifacts/tools-venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --yes libxml2-utils
      - name: Install isolated Go analysis tools
        run: make tools
      - name: Check every module and independent consumers
        run: ./scripts/check.sh --consumers
